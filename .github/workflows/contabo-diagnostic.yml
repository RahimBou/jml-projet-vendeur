name: Diagnostic contrôlé Contabo

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostic:
    # Déclenchement manuel uniquement. Ne jamais ajouter pull_request ici.
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 3
    steps:
      - name: Vérifications non destructives
        shell: bash
        run: |
          set -eu
          echo "=== Identité d'exécution ==="
          whoami
          id
          echo "=== Système ==="
          uname -srm
          echo "=== Espace disque ==="
          df -h / /opt
          echo "=== Mémoire ==="
          free -h || true
          echo "=== Service JML ==="
          systemctl is-active jml-projet-vendeur || true
          echo "=== Commit du dossier déployé ==="
          if git -C /opt/jml-projet-vendeur rev-parse --is-inside-work-tree >/dev/null 2>&1; then
            git -C /opt/jml-projet-vendeur rev-parse HEAD
            git -C /opt/jml-projet-vendeur log -1 --format="%h %s"
            echo "=== Modifications locales (noms seulement) ==="
            git -C /opt/jml-projet-vendeur status --short || true
          else
            echo "Dossier applicatif introuvable ou sans métadonnées Git lisibles."
          fi
          echo "=== Réponse HTTP locale ==="
          curl --max-time 5 -sS -o /dev/null -w "Accueil local: HTTP %{http_code}\n" http://127.0.0.1:10000/ || true
          curl --max-time 5 -sS -o /dev/null -w "Santé locale: HTTP %{http_code}\n" http://127.0.0.1:10000/health || true
          echo "=== Réponse HTTP publique ==="
          curl --max-time 10 -sS -o /dev/null -w "Accueil public: HTTP %{http_code}\n" https://jml.immo/ || true
          curl --max-time 10 -sS -o /dev/null -w "Santé publique: HTTP %{http_code}\n" https://jml.immo/health || true
          echo "Diagnostic terminé. Aucun secret ni contenu de fichier de configuration n'a été affiché.";

name: Diagnostic contrôlé Contabo

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostic:
    # Déclenchement manuel uniquement. Ne jamais ajouter pull_request ici.
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 3
    steps:
      - name: Vérifications non destructives
        shell: bash
        run: |
          set -eu
          echo "=== Identité d'exécution ==="
          whoami
          id
          echo "=== Système ==="
          uname -srm
          echo "=== Espace disque ==="
          df -h / /opt
          echo "=== Mémoire ==="
          free -h || true
          echo "=== Service JML ==="
          systemctl is-active jml-projet-vendeur || true
          echo "=== Réponse locale du site ==="
          curl --max-time 5 -sS -o /dev/null -w "HTTP %{http_code}\n" http://127.0.0.1:10000/ || true
          echo "Diagnostic terminé. Aucun fichier ni paramètre secret n'a été affiché.";

name: DVF - veille et mise à jour automatique

on:
  schedule:
    # Vérifie chaque semaine si la source officielle DVF a été mise à jour.
    # La source ne publie pas de webhook ; le contrôle hebdomadaire détecte
    # la nouvelle version dès le prochain passage.
    - cron: "15 3 * * 1"
  workflow_dispatch:

jobs:
  import-dvf:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: node scripts/import-dvf.js
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_SSL: "true"
          DVF_IMPORT_YEARS: "2026,2025,2024,2023,2022"

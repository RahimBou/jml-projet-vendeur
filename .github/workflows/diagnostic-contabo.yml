name: Diagnostic Contabo JML

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/diagnostic-contabo.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: diagnostic-contabo
  cancel-in-progress: false

jobs:
  diagnostic:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 5
    steps:
      - name: Récupérer le code de référence GitHub
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Comparer le code installé à GitHub (lecture seule)
        shell: bash
        run: |
          set -u
          app_dir="/opt/jml-projet-vendeur"
          ref_dir="$GITHUB_WORKSPACE"
          echo "=== Référence GitHub ==="
          git -C "$ref_dir" log -1 --format='Commit GitHub: %H (%cI)'
          echo "=== Comparaison du code applicatif suivi par Git ==="
          if [ ! -d "$app_dir" ]; then
            echo "ERREUR: répertoire applicatif absent: $app_dir"
            exit 1
          fi
          same=0
          different=0
          missing=0
          shown=0
          while IFS= read -r -d '' f; do
            ref_file="$ref_dir/$f"
            app_file="$app_dir/$f"
            if [ ! -f "$app_file" ]; then
              missing=$((missing+1))
              if [ "$shown" -lt 100 ]; then echo "ABSENT SUR CONTABO: $f"; shown=$((shown+1)); fi
            elif cmp -s -- "$ref_file" "$app_file"; then
              same=$((same+1))
            else
              different=$((different+1))
              if [ "$shown" -lt 100 ]; then echo "DIFFÉRENT: $f"; shown=$((shown+1)); fi
            fi
          done < <(git -C "$ref_dir" ls-files -z)
          echo "Fichiers identiques: $same"
          echo "Fichiers différents: $different"
          echo "Fichiers suivis absents de Contabo: $missing"
          echo "=== Commit Git local (si lisible) ==="
          git -c safe.directory="$app_dir" -C "$app_dir" log -1 --format='Commit local: %H (%cI) %s' 2>/dev/null || echo "Commit local illisible; comparaison de contenu effectuée malgré tout."
          echo "=== Fin comparaison: aucun fichier du site n'a été modifié ==="

      - name: Diagnostic non destructif du serveur
        shell: bash
        run: |
          set -u
          echo "=== Runner ==="
          id
          uname -a

          echo "=== Ressources ==="
          df -h /
          free -h

          echo "=== Services JML actifs ou installés ==="
          systemctl list-units --type=service --all --no-legend 2>/dev/null | grep -i jml || true
          systemctl list-unit-files --type=service --no-legend 2>/dev/null | grep -i jml || true

          echo "=== Répertoire et commit du service JML ==="
          app_dir="/opt/jml-projet-vendeur"
          if [ -d "$app_dir" ]; then
            echo "Répertoire applicatif: $app_dir"
            echo "Permissions du dossier applicatif:"
            ls -ld "$app_dir" "$app_dir/.git" 2>&1 || true
            if [ -d "$app_dir/.git" ]; then
              for f in HEAD config; do
                if [ -r "$app_dir/.git/$f" ]; then
                  echo ".git/$f: présent et lisible"
                elif [ -e "$app_dir/.git/$f" ]; then
                  echo ".git/$f: présent mais non lisible"
                else
                  echo ".git/$f: absent"
                fi
              done
            elif [ -f "$app_dir/.git" ]; then
              echo ".git est un fichier de pointeur:"
              sed -n '1p' "$app_dir/.git" 2>&1 || true
            else
              echo "Aucun dossier/fichier .git standard détecté."
            fi
            echo "Diagnostic Git (erreur éventuelle, sans configuration ni secrets):"
            git -C "$app_dir" rev-parse --is-inside-work-tree 2>&1 || true
            if git -C "$app_dir" rev-parse --is-inside-work-tree >/dev/null 2>&1; then
              echo "Commit installé:"
              git -C "$app_dir" log -1 --format='%H %cI %s' 2>/dev/null || echo "Impossible de lire le commit"
              echo "Branche locale:"
              git -C "$app_dir" branch --show-current 2>/dev/null || true
              echo "État des modifications (résumé):"
              git -C "$app_dir" status --short 2>/dev/null | head -n 30 || true
            else
              echo "Le dossier existe mais Git ne le reconnaît pas."
            fi
          else
            echo "Répertoire applicatif non trouvé: $app_dir"
          fi

          echo "=== Informations systemd du service JML ==="
          systemctl show jml-projet-vendeur.service --no-pager \
            -p Id -p ActiveState -p SubState -p MainPID -p WorkingDirectory -p FragmentPath -p EnvironmentFiles 2>/dev/null || true
          echo "=== Outil de sauvegarde PostgreSQL ==="
          if command -v pg_dump >/dev/null 2>&1; then
            pg_dump --version
          else
            echo "pg_dump non installé"
          fi
          echo "=== Présence des variables PostgreSQL dans le processus (valeurs masquées) ==="
          pid_check=$(systemctl show jml-projet-vendeur.service -p MainPID --value 2>/dev/null || echo 0)
          if [ "$pid_check" != "0" ] && [ -r "/proc/$pid_check/environ" ]; then
            if tr '\\0' '\\n' < "/proc/$pid_check/environ" 2>/dev/null | grep -qE '^(DATABASE_URL|PGHOST|PGDATABASE)='; then
              echo "Variables de connexion PostgreSQL détectées dans l'environnement du processus (valeurs non affichées)."
            else
              echo "Aucune variable PostgreSQL standard détectée dans l'environnement lisible du processus."
            fi
          else
            echo "Environnement du processus non lisible par le runner."
          fi
          pid=$(systemctl show jml-projet-vendeur.service -p MainPID --value 2>/dev/null || echo 0)
          case "$pid" in
            ''|0) ;;
            *)
              if [ -r "/proc/$pid/cwd" ]; then
                printf 'Répertoire courant du processus: '
                readlink "/proc/$pid/cwd" || true
              fi
              ;;
          esac

          echo "=== Dépôts Git accessibles dans les emplacements habituels ==="
          for root in /opt /srv /var/www /home; do
            if [ -d "$root" ]; then
              find "$root" -maxdepth 5 -type d -name .git -print 2>/dev/null || true
            fi
          done

          echo "=== Fichiers applicatifs candidats ==="
          for root in /opt /srv /var/www; do
            if [ -d "$root" ]; then
              find "$root" -maxdepth 4 -type f \( -name package.json -o -name server.js \) -print 2>/dev/null || true
            fi
          done

          echo "=== Contrôles HTTP local (ports connus uniquement) ==="
          for url in http://127.0.0.1/ http://127.0.0.1/health http://127.0.0.1:3000/health http://127.0.0.1:3000/; do
            code=$(curl --max-time 3 -sS -o /dev/null -w '%{http_code}' "$url" 2>/dev/null || true)
            if [ -n "$code" ]; then echo "$url -> HTTP $code"; fi
          done

          echo "Diagnostic terminé. Aucun secret ni contenu de configuration n'a été affiché."

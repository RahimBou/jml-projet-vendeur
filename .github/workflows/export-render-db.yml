name: Ancien export externe désactivé

# Workflow archivé volontairement : JML est désormais administré sur Contabo.
# Aucune connexion ni export vers une base externe n'est autorisé ici.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-latest
    steps:
      - name: Arrêt volontaire
        run: |
          echo "Cet ancien workflow d'export externe est désactivé."
          echo "Utiliser exclusivement le serveur et la base PostgreSQL Contabo."
          exit 1

name: Vérification code

on:
  push:
    branches: [main, "automation/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: node --check server.js
      - run: node --check market-intelligence.js
      - run: node --check external-estimators.js
      - run: node --check scripts/import-dvf.js
      - run: node --check scripts/import-dvfplus.js
      - run: node scripts/check-inline-html.js

name: Vérification code

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: node --check server.js
      - run: node --check market-intelligence.js
      - run: node --check external-estimators.js
      - run: node --check scripts/import-dvf.js
      - run: node --check scripts/import-dvfplus.js
      - run: node -e "const fs=require('fs'); const html=fs.readFileSync('public/vendeur-secteur.html','utf8'); const scripts=[...html.matchAll(/<script\\b[^>]*>([\\s\\S]*?)<\\/script>/gi)].map(m=>m[1]).filter(x=>x.trim()); if(!scripts.length) throw new Error('No inline JavaScript found'); fs.writeFileSync('/tmp/jml-vendeur-inline.js',scripts.join('\\n;\\n'));" && node --check /tmp/jml-vendeur-inline.js

name: DVF and DPE recovery tests

on:
  push:
    branches:
      - feature/dvf-free-recovery-robot
  pull_request:
    branches:
      - main

jobs:
  test-dpe-recovery:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run DPE and DVF recovery tests
        run: npm test

name: DVF+ Ardennes - import maisons et appartements

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/import-dvfplus-ardennes.yml"

permissions:
  contents: read

jobs:
  import-dvfplus-ardennes:
    # Le fichier DVF+ est déjà sur le serveur Contabo ; l'import tourne donc sur son runner.
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Vérifier et décompresser le fichier DVF+ présent sur Contabo
        shell: bash
        run: |
          set -euo pipefail
          SOURCE="/opt/jml-projet-vendeur/dvfplus_ardennes_residential.csv.gz"
          test -s "$SOURCE"
          gzip -t "$SOURCE"
          mkdir -p "$RUNNER_TEMP/jml-dvfplus"
          gzip -dc "$SOURCE" > "$RUNNER_TEMP/jml-dvfplus/dvf_plus.csv"
          test -s "$RUNNER_TEMP/jml-dvfplus/dvf_plus.csv"
          echo "Fichier DVF+ vérifié ; lignes CSV : $(wc -l < "$RUNNER_TEMP/jml-dvfplus/dvf_plus.csv")"

      - name: Vérifier la configuration PostgreSQL sans afficher les identifiants
        shell: bash
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_SSL: "true"
          DVF_PLUS_CSV_PATH: ${{ runner.temp }}/jml-dvfplus/dvf_plus.csv
        run: |
          set -euo pipefail
          if [ -z "${DATABASE_URL:-}" ]; then
            echo "Le secret GitHub DATABASE_URL est absent ; import annulé."
            exit 1
          fi
          echo "::add-mask::$DATABASE_URL"
          echo "URL PostgreSQL configurée ; valeur masquée."
          node -e 'const u=new URL(process.env.DATABASE_URL); if (!["postgres:","postgresql:"].includes(u.protocol) || !u.hostname || !u.pathname.slice(1)) process.exit(1); console.log("Hôte PostgreSQL :",u.hostname,"; base :",u.pathname.slice(1))'

      - name: Installer les dépendances
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Tester la connexion PostgreSQL
        shell: bash
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_SSL: "true"
        run: |
          set -euo pipefail
          node - <<'NODE'
          const { Pool } = require("pg");
          const pool = new Pool({
            connectionString: process.env.DATABASE_URL,
            ssl: { rejectUnauthorized: false },
            max: 1,
            connectionTimeoutMillis: 15000
          });
          (async () => {
            try {
              const r = await pool.query("SELECT current_database() AS db, current_user AS usr");
              console.log("Connexion PostgreSQL OK ; base :", r.rows[0].db, "; utilisateur :", r.rows[0].usr);
            } finally {
              await pool.end();
            }
          })().catch(e => { console.error("Connexion PostgreSQL impossible :", e.message); process.exit(1); });
          NODE

      - name: Importer DVF+ Ardennes dans PostgreSQL
        run: node scripts/import-dvfplus.js
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_SSL: "true"
          DVF_PLUS_CSV_PATH: ${{ runner.temp }}/jml-dvfplus/dvf_plus.csv

services:
  - type: web
    name: jml-projet-vendeur
    runtime: node
    plan: free
    autoDeploy: true
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSL
        value: "true"
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM
        sync: false
      - key: JML_ADMIN_PASSWORD
        sync: false
      - key: PUBLIC_APP_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_CALENDAR_REDIRECT_URI
        sync: false
      - key: GOOGLE_CALENDAR_ID
        value: "primary"
      - key: GOOGLE_MAPS_API_KEY
        sync: false
      - key: WEBSTAT_API_KEY
        sync: false
      - key: JML_CALENDAR_TOKEN_SECRET
        sync: false
